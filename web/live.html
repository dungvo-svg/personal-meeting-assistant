<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Phụ đề cuộc họp</title>
<style>
:root{color-scheme:light;font-family:system-ui,"Segoe UI","Lao UI","Leelawadee UI","Noto Sans Lao",sans-serif;color:#13262e;background:#f6f8f8}
*{box-sizing:border-box}body{margin:0;font-size:28px;line-height:1.45}
.banner{position:sticky;top:0;z-index:2;background:#fff3cd;color:#5c4400;border-bottom:2px solid #e3c56a;padding:10px 24px;font-size:19px;line-height:1.35}
.bar{display:flex;gap:16px;align-items:baseline;justify-content:space-between;padding:14px 24px 4px;color:#123b42}
.bar h1{font-size:24px;margin:0;font-weight:650}.state{font-size:18px;color:#4b6670;white-space:nowrap}.state.live::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:#1f9d55;margin-right:8px}
main{padding:6px 24px 48px;max-width:1500px;margin:auto}
.seg{padding:12px 0;border-bottom:1px solid #dbe3e5}
.meta{display:flex;gap:8px;align-items:center;font-size:16px;color:#5b707a}
.tag{padding:1px 9px;border-radius:12px;font-weight:650;font-size:15px;background:#dce8ea;color:#173e46}.tag.lo{background:#ffe3c7;color:#6b3300}.tag.me{background:#17665e;color:#fff}.tag.warn{background:#f6d5d3;color:#7a1f1c}
.text{margin-top:2px;overflow-wrap:anywhere}
.vi-line{margin-top:6px;padding:8px 14px;border-left:6px solid #17665e;background:#e6f3f1;color:#0d3a36;font-weight:560;overflow-wrap:anywhere}
.vi-line small{display:block;font-size:15px;font-weight:600;color:#3d6b66}
.wait{margin-top:6px;font-size:20px;color:#8a979d;font-style:italic}
.gap{font-size:20px;color:#8a979d;font-style:italic}
.empty{padding:60px 0;text-align:center;color:#6b7e86;font-size:26px}
</style></head><body>
<div class="banner" role="note">Chữ trên màn hình là <b>nhận dạng tự động, chưa được xác minh</b>, có thể sai. Bản dịch tiếng Việt do <b>Claude</b> viết, <b>trễ vài chục giây</b> so với lời nói.</div>
<div class="bar"><h1 id="title">Phụ đề cuộc họp</h1><div class="state" id="state">đang kết nối…</div></div>
<main id="list"><div class="empty">Đang chờ dữ liệu…</div></main>
<script>
const list = document.getElementById('list'), stateEl = document.getElementById('state'), titleEl = document.getElementById('title');
const STATES = { LISTENING: 'đang nghe', OFF: 'chưa nghe', WARMING: 'đang chuẩn bị', WARM_READY: 'sẵn sàng', WAITING_FOR_SOURCE: 'chờ nguồn âm thanh', LOADING_ASR: 'đang nạp mô hình', ERROR: 'lỗi thu âm', STOPPING: 'đang dừng' };
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const clock = iso => new Date(iso).toLocaleTimeString('vi-VN', { hour12: false });

function render(data) {
  titleEl.textContent = data.session?.title || 'Phụ đề cuộc họp';
  stateEl.textContent = !data.session ? 'chưa có cuộc họp' : data.session.ended ? 'cuộc họp đã kết thúc' : (STATES[data.captureState] || data.captureState);
  stateEl.className = 'state' + (data.session && !data.session.ended && data.captureState === 'LISTENING' ? ' live' : '');
  // Stay put when someone scrolled up to re-read; follow the newest line otherwise.
  const atBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 160;
  list.replaceChildren();
  if (!data.segments.length) list.append(el('div', 'empty', data.session ? 'Chưa có chữ nào. Chữ sẽ hiện ngay khi có người nói.' : 'Chưa có cuộc họp đang mở.'));
  for (const s of data.segments) {
    if (s.gap) { list.append(el('div', 'seg gap', s.text)); continue; }
    const seg = el('div', 'seg'), meta = el('div', 'meta');
    meta.append(el('span', '', clock(s.at)));
    if (s.language) meta.append(el('span', 'tag ' + s.language, s.language === 'lo' ? 'ລາວ · Lào' : 'Việt'));
    if (s.mic) meta.append(el('span', 'tag me', 'Tôi'));
    if (s.unreliable) meta.append(el('span', 'tag warn', 'chữ nhận dạng kém'));
    const text = el('div', 'text', s.text + (s.repeat ? ` [×${s.repeat}]` : '')); if (s.language) text.lang = s.language;
    seg.append(meta, text);
    if (s.translation) { const vi = el('div', 'vi-line'); vi.lang = 'vi'; vi.append(el('small', '', '(Claude dịch)'), document.createTextNode(s.translation)); seg.append(vi); }
    else if (s.language === 'lo' && !s.unreliable) seg.append(el('div', 'wait', 'đang chờ Claude dịch…'));
    list.append(seg);
  }
  if (atBottom) window.scrollTo(0, document.documentElement.scrollHeight);
}

let busy = false, again = false, timer = null;
async function refresh() {
  if (busy) { again = true; return; }
  busy = true;
  try {
    const response = await fetch('/api/live', { cache: 'no-store' });
    if (response.status === 403) { stateEl.textContent = 'mở lại trang từ địa chỉ /live'; return; }
    render(await response.json());
  } catch { stateEl.textContent = 'mất kết nối tới máy chủ…'; stateEl.className = 'state'; }
  finally { busy = false; if (again) { again = false; schedule(); } }
}
// Every runtime change (status too) emits an update; one fetch per 300 ms is plenty for captions.
function schedule() { if (!timer) timer = setTimeout(() => { timer = null; refresh(); }, 300); }
const stream = new EventSource('/api/live-events');
stream.addEventListener('update', schedule);
setInterval(refresh, 10000);
refresh();
</script></body></html>
